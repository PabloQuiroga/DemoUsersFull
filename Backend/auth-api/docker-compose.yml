version: '3.8'

services:
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_pass
    ports:
      - "3306:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  auth-api:
    build: .
    container_name: auth-api
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://auth-db:3306/auth_db
      QUARKUS_DATASOURCE_USERNAME: auth_user
      QUARKUS_DATASOURCE_PASSWORD: auth_pass
    ports:
      - "8080:8080"
    networks:
      - auth-network

volumes:
  auth_db_data:

networks:
  auth-network:
    driver: bridge
