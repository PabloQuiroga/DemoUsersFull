version: '3.8'

services:
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_pass
    ports:
      - "3306:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    networks:
      - auth-network
    healthcheck:
      test: "mysqladmin ping -h localhost -u root -proot_password"
      interval: 5s
      timeout: 5s
      retries: 20

  auth-api:
    build: .
    container_name: auth-api
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://auth-db:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true
      QUARKUS_DATASOURCE_USERNAME: auth_user
      QUARKUS_DATASOURCE_PASSWORD: auth_pass
      # Esperar un poco más si la conexión tarda
      QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT: 30
    ports:
      - "8080:8080"
    networks:
      - auth-network

volumes:
  auth_db_data:

networks:
  auth-network:
    driver: bridge
